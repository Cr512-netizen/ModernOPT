plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // Sodium's download is a jar-in-jar wrapper. This configuration only feeds the
    // extraction task below; it is never added to the runtime classpath.
    sodiumCompile {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.5'
    sodiumCompile 'maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge'
}

// Compile-only against Sodium's inner mod jar so the optional config entry point can
// implement Sodium's 0.8.13 config API. ModernOPT does not ship or require Sodium:
// the class is only loaded by Sodium itself, and is inert when Sodium is absent.
def sodiumInnerJar = layout.buildDirectory.file('sodium/sodium-inner.jar')
def extractSodiumInnerJar = tasks.register('extractSodiumInnerJar', Copy) {
    from({ zipTree(configurations.sodiumCompile.singleFile) }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-*.jar'
    }
    into layout.buildDirectory.dir('sodium')
    eachFile { details ->
        if (!details.isDirectory()) {
            details.path = 'sodium-inner.jar'
        }
    }
    includeEmptyDirs = false
}

dependencies {
    compileOnly files(sodiumInnerJar)
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractSodiumInnerJar
}

neoForge {
    version = project.neo_version

    parchment {
        // Optional: nicer parameter names while developing. Safe to remove.
        // minecraftVersion = project.minecraft_version
        // mappingsVersion = '2024.11.17'
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // A normal dev launch stays a normal game. The benchmark harness is opt-in with
            // -Pbench (or one of its -Pbench* options) so it cannot change FPS in the background.
            def benchRequested = project.hasProperty('bench')
                    || project.hasProperty('benchStates')
                    || project.hasProperty('benchWarmup')
                    || project.hasProperty('benchSample')
                    || project.hasProperty('benchBaseline')
                    || project.hasProperty('benchTolerance')
                    || project.hasProperty('benchReference')
            if (benchRequested) {
            systemProperty 'modernopt.bench', 'true'
            if (project.hasProperty('benchStates')) {
                systemProperty 'modernopt.bench.states', project.benchStates
            }
            if (project.hasProperty('benchWarmup')) {
                systemProperty 'modernopt.bench.warmup', project.benchWarmup
            }
            if (project.hasProperty('benchSample')) {
                systemProperty 'modernopt.bench.sample', project.benchSample
            }
            if (project.hasProperty('benchBaseline')) {
                systemProperty 'modernopt.bench.baseline', project.benchBaseline
            }
            if (project.hasProperty('benchTolerance')) {
                systemProperty 'modernopt.bench.tolerance', project.benchTolerance
            }
            if (project.hasProperty('benchReference')) {
                systemProperty 'modernopt.bench.reference', project.benchReference
            }






            if (project.hasProperty('benchKeepPosition')) {
                systemProperty 'modernopt.bench.keepPosition', 'true'
            }
            // GPU timestamps are a development aid but cost ~10-15% FPS on some drivers.
            // Measure frame rate without them by default; -PbenchProfile enables the stage
            // timers for a separate profile run.
            if (!project.hasProperty('benchProfile')) {
                systemProperty 'modernopt.bench.nogpu', 'true'
            }
            programArgument '--quickPlaySingleplayer'
            programArgument 'ModernOPTTest'
            }
        }
        bench {
            client()
            systemProperty 'modernopt.bench', 'true'
            if (project.hasProperty('benchStates')) {
                systemProperty 'modernopt.bench.states', project.benchStates
            }
            if (project.hasProperty('benchWarmup')) {
                systemProperty 'modernopt.bench.warmup', project.benchWarmup
            }
            if (project.hasProperty('benchSample')) {
                systemProperty 'modernopt.bench.sample', project.benchSample
            }
            if (project.hasProperty('benchBaseline')) {
                systemProperty 'modernopt.bench.baseline', project.benchBaseline
            }
            if (project.hasProperty('benchTolerance')) {
                systemProperty 'modernopt.bench.tolerance', project.benchTolerance
            }
            if (project.hasProperty('benchReference')) {
                systemProperty 'modernopt.bench.reference', project.benchReference
            }
            if (project.hasProperty('benchKeepPosition')) {
                systemProperty 'modernopt.bench.keepPosition', 'true'
            }
            // GPU timestamps are a development aid but cost ~10-15% FPS on some drivers.
            // Measure frame rate without them by default; -PbenchProfile enables the stage
            // timers for a separate profile run.
            if (!project.hasProperty('benchProfile')) {
                systemProperty 'modernopt.bench.nogpu', 'true'
            }
            programArgument '--quickPlaySingleplayer'
            programArgument 'ModernOPTTest'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

// Mixin annotation processor: generates the refmap used at runtime.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// Ship the license with the binary, as required by Apache-2.0 distribution practice.
jar {
    from('LICENSE') { into 'META-INF' }
    from('NOTICE') { into 'META-INF' }
    from('THIRD-PARTY-NOTICES.txt') { into 'META-INF' }
}

// Validates every core shader with glslangValidator and, for the compute pass, spirv-val.
// Set -PrequireShaderTools=true in CI so a missing tool is an error rather than a skip.
tasks.register('validateShaders') {
    group = 'verification'
    description = 'Runs glslangValidator (and spirv-val for the compute shader) on core shaders.'
    def shaderDirectory = file('src/main/resources/assets/modernopt/shaders/core')
    def required = project.hasProperty('requireShaderTools')

    doLast {
        def runTool = { List<String> command ->
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def output = process.inputStream.getText('UTF-8')
            def exit = process.waitFor()
            return [exit, output]
        }
        def exists = { String tool ->
            try {
                def (int exit, String output) = runTool([tool, '--version'])
                return output.toLowerCase().contains('glslang') || output.toLowerCase().contains('spirv')
            } catch (Throwable ignored) {
                return false
            }
        }
        def glslang = [System.getenv('GLSLANG_VALIDATOR'), 'glslangValidator', 'glslang']
                .findAll { it != null && !it.isBlank() }
                .find { exists(it) }
        if (glslang == null) {
            if (required) {
                throw new GradleException("glslangValidator is required but was not found (PATH or GLSLANG_VALIDATOR)")
            }
            logger.warn('glslangValidator not found; shader validation skipped')
            return
        }
        def spirvVal = [System.getenv('SPIRV_VAL'), 'spirv-val']
                .findAll { it != null && !it.isBlank() }
                .find { exists(it) }

        def temporaryDirectory = file("${buildDir}/shader-validation")
        temporaryDirectory.mkdirs()
        def failures = []
        shaderDirectory.listFiles().findAll { it.name.endsWith('.vsh') || it.name.endsWith('.fsh') || it.name.endsWith('.comp') }
                .sort { it.name }
                .each { shader ->
                    String stage = shader.name.endsWith('.vsh') ? 'vert'
                            : shader.name.endsWith('.fsh') ? 'frag' : 'comp'
                    def (int exit, String output) = runTool([glslang, '-S', stage, shader.absolutePath])
                    if (exit != 0) {
                        failures << "${shader.name} (glslang):\n${output}"
                    }
                    if (stage == 'comp') {
                        def spirv = new File(temporaryDirectory, shader.name + '.spv')
                        def (int compileExit, String compileOutput) = runTool([
                                glslang, '-G', '--target-env', 'opengl',
                                '-o', spirv.absolutePath, shader.absolutePath])
                        if (compileExit != 0) {
                            failures << "${shader.name} (spirv compile):\n${compileOutput}"
                        } else if (exists(spirvVal)) {
                            def (int validateExit, String validateOutput) = runTool([
                                    spirvVal, '--target-env', 'opengl4.3', spirv.absolutePath])
                            if (validateExit != 0) {
                                failures << "${shader.name} (spirv-val):\n${validateOutput}"
                            }
                        } else if (required) {
                            failures << 'spirv-val is required but was not found (PATH or SPIRV_VAL)'
                        }
                    }
                }
        if (!failures.isEmpty()) {
            throw new GradleException("Shader validation failed:\n\n" + failures.join('\n\n'))
        }
        logger.lifecycle("Shader validation passed (${shaderDirectory.listFiles().count { it.name.endsWith('.vsh') || it.name.endsWith('.fsh') || it.name.endsWith('.comp') }} files)")
    }
}

