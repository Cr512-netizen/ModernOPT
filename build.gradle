plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

neoForge {
    version = project.neo_version
    runs { client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range, loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
