plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs { client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
