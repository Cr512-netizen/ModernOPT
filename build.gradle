plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // Sodium's download is a jar-in-jar wrapper. This configuration only feeds the
    // extraction task below; it is never added to the runtime classpath.
    sodiumCompile {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    sodiumCompile 'maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge'
}

// Compile-only against Sodium's inner mod jar so the optional config entry point can
// implement Sodium's 0.8.13 config API. ModernOPT does not ship or require Sodium:
// the class is only loaded by Sodium itself, and is inert when Sodium is absent.
def sodiumInnerJar = layout.buildDirectory.file('sodium/sodium-inner.jar')
def extractSodiumInnerJar = tasks.register('extractSodiumInnerJar', Copy) {
    from({ zipTree(configurations.sodiumCompile.singleFile) }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-*.jar'
    }
    into layout.buildDirectory.dir('sodium')
    eachFile { details ->
        if (!details.isDirectory()) {
            details.path = 'sodium-inner.jar'
        }
    }
    includeEmptyDirs = false
}

dependencies {
    compileOnly files(sodiumInnerJar)
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractSodiumInnerJar
}

neoForge {
    version = project.neo_version

    parchment {
        // Optional: nicer parameter names while developing. Safe to remove.
        // minecraftVersion = project.minecraft_version
        // mappingsVersion = '2024.11.17'
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--quickPlaySingleplayer'
            programArgument 'ModernOPTTest'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

// Mixin annotation processor: generates the refmap used at runtime.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
