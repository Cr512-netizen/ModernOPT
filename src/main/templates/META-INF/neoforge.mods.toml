modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Cr512-netizen"
displayURL="https://github.com/Cr512-netizen/ModernOPT"
issueTrackerURL="https://github.com/Cr512-netizen/ModernOPT/issues"
description='''Experimental client-side render scaling and spatial upscaling for Minecraft Java Edition 1.21.1. See the project README for current features, limitations, licensing, and compatibility status.'''

[[mixins]]
config="modernopt.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
