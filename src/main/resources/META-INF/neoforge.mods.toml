modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Cr512-netizen/ModernOPT/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "modernopt.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Sodium 0.8.13 reads this property to find optional config entry points.
# The class is only loaded by Sodium and is inert when Sodium is not installed.
[modproperties.${mod_id}]
"sodium:config_api_user" = "net.cr512.modernopt.compat.sodium.ModernOptSodiumConfig"
